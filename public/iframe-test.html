<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iframe Modal Test Bench</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --panel-bg: rgba(23, 28, 41, 0.7);
      --border-color: rgba(255, 255, 255, 0.1);
      --accent-color: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.5);
      --text-color: #f3f4f6;
      --text-muted: #9ca3af;
      --sidebar-width: 320px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at top right, #1e293b, var(--bg-color));
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: row;
      justify-content: flex-start;
      overflow: hidden;
    }

    /* 사이드바 스타일 */
    .sidebar {
      width: var(--sidebar-width);
      height: 100vh;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(20px);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 10;
    }

    .sidebar-header {
      padding: 1.5rem;
      border-bottom: 1px solid var(--border-color);
    }

    .sidebar-header h2 {
      font-size: 1.25rem;
      font-weight: 800;
      background: linear-gradient(135deg, #60a5fa, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.75rem;
      letter-spacing: -0.03em;
    }

    .search-box {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-color);
      padding: 0.5rem 0.75rem;
      font-size: 0.875rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-box:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 8px rgba(59, 130, 246, 0.3);
    }

    .sidebar-tabs {
      display: flex;
      border-bottom: 1px solid var(--border-color);
      background: rgba(0, 0, 0, 0.1);
    }

    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.75rem;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }

    .tab-btn:hover {
      color: var(--text-color);
      background: rgba(255, 255, 255, 0.02);
    }

    .tab-btn.active {
      color: var(--accent-color);
      border-bottom: 2px solid var(--accent-color);
      background: rgba(59, 130, 246, 0.05);
    }

    .list-container {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    /* 스크롤바 커스텀 */
    .list-container::-webkit-scrollbar {
      width: 6px;
    }
    .list-container::-webkit-scrollbar-track {
      background: transparent;
    }
    .list-container::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
    }
    .list-container::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .list-item {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      padding: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .list-item:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.15);
      transform: translateX(2px);
    }

    .list-item.active {
      background: rgba(59, 130, 246, 0.15);
      border-color: var(--accent-color);
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.15);
    }

    .item-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .item-id {
      font-family: monospace;
      font-size: 0.875rem;
      font-weight: 700;
      color: #60a5fa;
    }

    .item-type {
      font-size: 0.7rem;
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-color);
      font-weight: 600;
    }

    .list-item.active .item-type {
      background: var(--accent-color);
      color: white;
    }

    .item-title {
      font-size: 0.8125rem;
      color: var(--text-color);
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-path {
      font-size: 0.75rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: monospace;
    }

    /* 메인 콘텐츠 영역 스타일 */
    .main-content {
      flex: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 2rem;
      overflow-y: auto;
      align-items: center;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 2.25rem;
      font-weight: 800;
      background: linear-gradient(135deg, #60a5fa, #3b82f6, #1d4ed8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
      letter-spacing: -0.05em;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .control-panel {
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 1.25rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    label {
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .range-wrapper {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 120px;
      height: 6px;
      border-radius: 3px;
      background: #374151;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent-color);
      cursor: pointer;
      box-shadow: 0 0 10px var(--accent-glow);
      transition: transform 0.1s;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    .value-display {
      font-family: monospace;
      font-size: 0.8125rem;
      background: rgba(0, 0, 0, 0.4);
      padding: 0.25rem 0.5rem;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      min-width: 55px;
      text-align: center;
    }

    .btn-preset {
      background: #1f2937;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-size: 0.8125rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-preset:hover {
      background: var(--accent-color);
      border-color: var(--accent-color);
      box-shadow: 0 0 15px var(--accent-glow);
      transform: translateY(-2px);
    }

    .iframe-wrapper {
      background: #1e293b;
      border: 2px solid var(--border-color);
      border-radius: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      position: relative;
      transition: border-color 0.3s, box-shadow 0.3s, width 0.3s, height 0.3s;
      margin: 0 auto;
    }

    .iframe-wrapper.active-glow {
      border-color: var(--accent-color);
      box-shadow: 0 0 30px var(--accent-glow);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
    }

    .info-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 1rem;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 8px;
      font-size: 0.8125rem;
      color: var(--text-muted);
    }

    .badge-status {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: rgba(16, 185, 129, 0.2);
      color: #10b981;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 0.75rem;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .badge-status::before {
      content: '';
      display: inline-block;
      width: 6px;
      height: 6px;
      background: #10b981;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 1; }
      50% { transform: scale(1.2); opacity: 0.5; }
      100% { transform: scale(0.9); opacity: 1; }
    }
  </style>
</head>
<body>
  <!-- 좌측 사이드바 -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h2>IA 화면 목록</h2>
      <input type="text" id="searchInput" class="search-box" placeholder="ID 또는 화면명 검색...">
    </div>
    <div class="sidebar-tabs">
      <button class="tab-btn active" id="tabPopup" onclick="switchTab('popup')">팝업</button>
      <button class="tab-btn" id="tabPage" onclick="switchTab('page')">화면</button>
      <button class="tab-btn" id="tabAll" onclick="switchTab('all')">전체</button>
    </div>
    <div class="list-container" id="listContainer">
      <div style="text-align: center; color: var(--text-muted); margin-top: 2rem;">화면 목록 로딩 중...</div>
    </div>
  </aside>

  <!-- 우측 메인 영역 -->
  <main class="main-content">
    <header>
      <h1>Iframe Modal Test Bench</h1>
      <p>부모 프레임 안의 모달과 <code>is-iframe</code> 클래스를 테스트합니다.</p>
    </header>

    <div class="container">
      <div class="control-panel">
        <div class="control-group">
          <label>스토리북 주소</label>
          <input type="text" id="storybookHost" class="search-box" style="width: 180px;" value="http://localhost:6006">
        </div>

        <div class="control-group">
          <label>가로 크기 (Width)</label>
          <div class="range-wrapper">
            <input type="range" id="widthSlider" min="320" max="1200" value="1000">
            <span class="value-display" id="widthVal">1000px</span>
          </div>
        </div>

        <div class="control-group">
          <label>세로 크기 (Height)</label>
          <div class="range-wrapper">
            <input type="range" id="heightSlider" min="400" max="900" value="700">
            <span class="value-display" id="heightVal">700px</span>
          </div>
        </div>
      </div>

      <div class="info-bar">
        <span>Target URL: <code style="color: #60a5fa;" id="currentUrl">-</code></span>
        <span class="badge-status">iframe mode active</span>
      </div>

      <div class="iframe-wrapper active-glow" id="iframeWrapper" style="width: 1000px; height: 700px;">
        <iframe src="" id="testIframe"></iframe>
      </div>
    </div>
  </main>

  <script>
    const LOCAL_STORYBOOK_BASE_URL = 'http://localhost:6006';
    const PROD_STORYBOOK_BASE_URL = 'https://jjoooon.github.io/study-nextjs-2026';
    const HYGITEST_STORYBOOK_BASE_URL = 'https://story-dev.hwgitest.com';

    const LOCAL_HOST_NAMES = new Set(['localhost', '127.0.0.1']);
    const HYGITEST_HOST_NAMES = new Set(['story-dev.hwgitest.com']);

    function getInitialStorybookBase() {
      const currentHost = window.location.hostname;
      if (LOCAL_HOST_NAMES.has(currentHost)) {
        return LOCAL_STORYBOOK_BASE_URL;
      } else if (HYGITEST_HOST_NAMES.has(currentHost)) {
        return HYGITEST_STORYBOOK_BASE_URL;
      }
      return PROD_STORYBOOK_BASE_URL;
    }

    const widthSlider = document.getElementById('widthSlider');
    const heightSlider = document.getElementById('heightSlider');
    const widthVal = document.getElementById('widthVal');
    const heightVal = document.getElementById('heightVal');
    const iframeWrapper = document.getElementById('iframeWrapper');
    const testIframe = document.getElementById('testIframe');
    const currentUrl = document.getElementById('currentUrl');
    const searchInput = document.getElementById('searchInput');
    const listContainer = document.getElementById('listContainer');
    const storybookHostInput = document.getElementById('storybookHost');

    // 도메인 호스트 기반으로 자동 추정된 스토리북 주소 입력 필드에 설정
    storybookHostInput.value = getInitialStorybookBase();

    let allItems = [];
    let currentTab = 'popup'; // 'popup' | 'page' | 'all'

    function updateIframeSize() {
      const w = widthSlider.value;
      const h = heightSlider.value;
      
      iframeWrapper.style.width = w + 'px';
      iframeWrapper.style.height = h + 'px';
      
      widthVal.textContent = w + 'px';
      heightVal.textContent = h + 'px';
    }

    widthSlider.addEventListener('input', updateIframeSize);
    heightSlider.addEventListener('input', updateIframeSize);

    function setPreset(w, h) {
      widthSlider.value = w;
      heightSlider.value = h;
      updateIframeSize();
    }

    // iframe 내부의 모달 크기 메시지 수신 처리
    window.addEventListener('message', (event) => {
      if (!event.data) return;

      // 초기 디폴트 크기 적용
      if (event.data.type === 'DIALOG_DEFAULT_SIZE') {
        const defaultWidth = event.data.width;
        const defaultHeight = event.data.height;

        // iframe의 가로/세로 조절
        iframeWrapper.style.width = defaultWidth + 'px';
        iframeWrapper.style.height = defaultHeight + 'px';

        // 슬라이더 컨트롤러 및 표시 값 동기화
        widthSlider.value = defaultWidth;
        widthVal.textContent = defaultWidth + 'px';
        heightSlider.value = defaultHeight;
        heightVal.textContent = defaultHeight + 'px';
      }

      // 동적 높이 리사이즈 적용
      if (event.data.type === 'DIALOG_RESIZE') {
        const newHeight = event.data.height;
        iframeWrapper.style.height = newHeight + 'px';
        heightSlider.value = newHeight;
        heightVal.textContent = newHeight + 'px';
      }
    });

    // ialist.json 데이터 fetch
    async function loadIAList() {
      try {
        const response = await fetch('./ialist.json');
        if (!response.ok) throw new Error('Failed to load ialist.json');
        allItems = await response.json();
        
        // 초기 기본 아이템 선택 (예: LTPZ055)
        const initialIndex = allItems.findIndex(i => i.id === 'LTPZ055');
        renderList();
        
        if (initialIndex !== -1) {
          setTimeout(() => {
            const initialItemElement = document.querySelector(`.list-item:nth-child(${initialIndex + 1})`) || document.querySelector('.list-item');
            if (initialItemElement) {
              window.selectItem(initialItemElement, initialIndex);
            }
          }, 100);
        }
      } catch (err) {
        listContainer.innerHTML = `<div style="text-align: center; color: #ef4444; padding: 1rem; font-size: 0.875rem;">데이터를 불러오는 중 오류가 발생했습니다: ${err.message}</div>`;
      }
    }

    // 탭 전환
    window.switchTab = function(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (tab === 'popup') document.getElementById('tabPopup').classList.add('active');
      else if (tab === 'page') document.getElementById('tabPage').classList.add('active');
      else document.getElementById('tabAll').classList.add('active');
      renderList();
    };

    // 아이템 선택 시 iframe 로드 주소 변경 (스토리북 캔버스 URL 사용)
    window.selectItem = function(element, itemIndex) {
      const item = allItems[itemIndex];
      document.querySelectorAll('.list-item').forEach(el => el.classList.remove('active'));
      element.classList.add('active');

      const storybookBase = storybookHostInput.value.trim() || 'http://localhost:6006';
      
      // 스토리북 Iframe URL 계산 공식
      let finalPath = item.path || '';
      if (/^LTPA350/i.test(item.id)) {
        finalPath = 'ispl';
      }
      const storyPath = 'app-' + finalPath.replace(/\//g, '-').toLowerCase() + '-' + item.id.toLowerCase();
      const url = `${storybookBase}/iframe.html?id=${storyPath}--default&viewMode=story`;

      testIframe.src = url;
      currentUrl.textContent = url;
    };

    // 리스트 렌더링
    function renderList() {
      const searchKeyword = searchInput.value.toLowerCase().trim();

      const filtered = allItems.filter(item => {
        // 1. 탭 필터링
        if (currentTab === 'popup' && item.popup !== '팝업') return false;
        if (currentTab === 'page' && item.popup !== '화면') return false;

        // 2. 검색어 필터링
        if (searchKeyword) {
          const idMatch = item.id.toLowerCase().includes(searchKeyword);
          const subIdMatch = item.subId && item.subId.toLowerCase().includes(searchKeyword);
          const dep4Match = item.dep4 && item.dep4.toLowerCase().includes(searchKeyword);
          const fileMatch = item.file && item.file.toLowerCase().includes(searchKeyword);
          return idMatch || subIdMatch || dep4Match || fileMatch;
        }

        return true;
      });

      if (filtered.length === 0) {
        listContainer.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 2rem; font-size: 0.8125rem;">검색 결과가 없습니다.</div>';
        return;
      }

      listContainer.innerHTML = filtered.map(item => {
        const originalIndex = allItems.findIndex(i => i.id === item.id && i.subId === item.subId && i.dep4 === item.dep4);

        let finalPath = item.path || '';
        if (/^LTPA350/i.test(item.id)) {
          finalPath = 'ispl';
        }
        const storyPath = 'app-' + finalPath.replace(/\//g, '-').toLowerCase() + '-' + item.id.toLowerCase();
        const itemUrl = `id=${storyPath}--default`;

        const currentFrameSrc = testIframe.src || '';
        const isActive = currentFrameSrc.includes(itemUrl);
        const activeClass = isActive ? 'active' : '';

        return `
          <div class="list-item ${activeClass}" onclick="selectItem(this, ${originalIndex})">
            <div class="item-meta">
              <span class="item-id">${item.id}${item.subId ? ' (' + item.subId + ')' : ''}</span>
              <span class="item-type">${item.popup || '화면'}</span>
            </div>
            <div class="item-title" title="${item.dep4}">${item.dep4}</div>
            <div class="item-path" title="${item.path || ''}">${item.path || ''}</div>
          </div>
        `;
      }).join('');
    }

    searchInput.addEventListener('input', renderList);
    storybookHostInput.addEventListener('input', () => {
      // 스토리북 주소가 변경되었을 때 현재 선택된 아이템의 iframe 새로고침
      const activeItem = document.querySelector('.list-item.active');
      if (activeItem) {
        activeItem.click();
      }
    });

    // 최초 로드
    loadIAList();
  </script>
</body>
</html>
