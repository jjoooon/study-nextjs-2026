<!DOCTYPE html>
<html lang="en" style="margin: 0; padding: 0;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    img{display: block;}
  </style>
</head>
<body style="margin: 0; padding: 0; height: 100vh;">
  <div style="display: grid; grid-template-rows: auto 1fr;">
    <div style=" width: 100%;">
      <div style="background-color: #312B27; display: flex; justify-content: space-between;position: relative;height: 48px; width: 100%;">
        <img src="./images/sample/sp_1.png" style="height: 100%;" alt="">
        <img src="./images/sample/sp_2.png" alt="" style="height: 100%;position: absolute; right:0;top:0; z-index: 1;">
      </div>
      <div style="background-color: #100f0e; display: flex; justify-content: space-between;position: relative;height:28px; width: 100%;">
        <img src="./images/sample/sp_3.png" style="height: 100%;" alt="">
        <img src="./images/sample/sp_4.png" style="height: 100%;position: absolute; right:0;top:0; z-index: 1;" alt="">
      </div>
    </div>
    <div style="display: flex; justify-content: space-between;position: relative; width: 100%; height: calc(100vh - 76px)">
      <div style="width: 55px; overflow: hidden; border-right:1px solid #ececec">
        <img src="./images/sample/sp_5.png" style="width: 56px;" alt="">
      </div>
      <div style="display: grid; grid-template-rows: 1fr auto; flex:1;">
        <div>
          <iframe src="/pub/proto/LTRA350" frameborder="0" style="width: 100%; height:100%;"></iframe>
        </div>
        <div style="width: 100%; background-color: #f4f4f4; height: 26px;">
          <img src="./images/sample/sp_6.png" alt="">
        </div>
      </div>
    </div>
  </div>
</body>
</html>
